<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <style id="current-color-scheme">.ColorScheme-Text{color:#232629}.ColorScheme-NegativeText{color:#da4453}</style>
  <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <!-- PC screen -->
    <rect x="2" y="5" width="11" height="8" rx="1"/>
    <path d="M7.5 13v3M5 16.25h5"/>
  </g>
  <!-- Pause: the TV keeps its image -->
  <g class="ColorScheme-Text" fill="currentColor">
    <rect x="15.5" y="5" width="1.75" height="8" rx="0.5"/>
    <rect x="18.75" y="5" width="1.75" height="8" rx="0.5"/>
  </g>
  <!-- Casting -->
  <circle class="ColorScheme-NegativeText" cx="18" cy="18" r="3.5" fill="currentColor"/>
</svg>
