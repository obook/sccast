<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sccast receiver</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  body { margin: 0; background: #000; }
  #lag { position: absolute; right: 2vw; bottom: 2vh; z-index: 10; color: #fff8; font: 2.5vh sans-serif; }
</style>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="lag"></div>
<script>
// Seconds behind the newest segment. Shaka's HLS default is 3 segments (3 s for sccast).
// sccast --latency overrides it with ?latency= on the stream URL.
// 1 s plays smoothly on the Sharp TV (about 2 to 3 s of real delay).
const DEFAULT_LATENCY = 1;

const context = cast.framework.CastReceiverContext.getInstance();
const player = context.getPlayerManager();
// Debug builds of sccast add ?debug to the stream URL: show the delay on the TV.
let debug = false;
// Continuous Matroska stream (sccast --format mkv): the native player buffers as it likes.
let mkv = false;
let latency = DEFAULT_LATENCY;

player.setMediaPlaybackInfoHandler((request, config) => {
  const url = new URL(request.media.contentId);
  debug = url.searchParams.has('debug');
  mkv = url.pathname.endsWith('.mkv');
  latency = Number(url.searchParams.get('latency')) || DEFAULT_LATENCY;
  config.shakaConfig = {
    manifest: { defaultPresentationDelay: latency },
    streaming: {
      // Shaka waits for 2 s of buffer by default: never reached this close to live.
      rebufferingGoal: Math.min(0.5, latency / 4),
      // Plays slightly faster when it falls behind, instead of staying late after a stall.
      liveSync: { enabled: true, targetLatency: latency, maxPlaybackRate: 1.1 },
    },
  };
  return config;
});

const options = new cast.framework.CastReceiverOptions();
options.useShakaForHls = true;
options.shakaVersion = '4.15.56';

// No documented getter for the player's <video>: try the known places.
// No optional chaining (?.): the page using it gave a black screen on the Sharp TV (old engine, suspected).
function video() {
  const cmp = document.querySelector('cast-media-player');
  if (cmp && typeof cmp.getMediaElement === 'function' && cmp.getMediaElement()) {
    return cmp.getMediaElement();
  }
  if (cmp && cmp.shadowRoot && cmp.shadowRoot.querySelector('video')) {
    return cmp.shadowRoot.querySelector('video');
  }
  return document.querySelector('video');
}

const lag = document.getElementById('lag');
setInterval(() => {
  if (mkv) {
    // Jump close to the end of the buffer when the player falls behind it.
    const v = video();
    if (!v) {
      lag.textContent = debug ? 'no video element' : '';
      return;
    }
    const end = v.buffered.length ? v.buffered.end(v.buffered.length - 1) : 0;
    const behind = end - v.currentTime;
    if (behind > latency + 1) {
      v.currentTime = end - latency;
    }
    lag.textContent = debug ? `${behind.toFixed(1)} s of buffer` : '';
    return;
  }
  const range = debug && player.getLiveSeekableRange();
  lag.textContent = range && range.end ? `${(range.end - player.getCurrentTimeSec()).toFixed(1)} s behind live` : '';
}, 1000);

context.start(options);
</script>
</body>
</html>
