[package]
name = "sccast"
version = "0.4.0"
edition = "2021"
# Set by gstreamer 0.25. Resolver 3 picks dependency versions that build with it.
rust-version = "1.92"
resolver = "3"
license = "MIT"
authors = ["Olivier Booklage <olivier.booklage@ac-bordeaux.fr>"]
description = "Cast your Linux desktop to a Chromecast"
repository = "https://github.com/obook/sccast"

[dependencies]
# AES-CTR of the mirror format's frames.
aes = "0.9.3"
ctr = "0.10.1"
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
futures-core = "0.3.34"
gstreamer = "0.25.4"
mdns-sd = "0.21.5"
ratatui = "0.30.2"
# thread_safe: the launch runs in a thread, so it can be given up after a timeout.
rust_cast = { version = "0.21.0", features = ["thread_safe"] }
# Already pulled by rust_cast: OFFER and ANSWER of the mirror format.
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# cargo-deb, used by packaging/build-deb.sh. $auto adds the shared libraries (libgstreamer, libc);
# the GStreamer plugins are loaded at run time, so they are listed by hand.
[package.metadata.deb]
maintainer = "Olivier Booklage <olivier.booklage@ac-bordeaux.fr>"
section = "video"
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-pipewire, xdg-desktop-portal"
recommends = "pipewire-pulse"
extended-description = "sccast casts the screen and sound of a Wayland desktop to a Chromecast or a device with Chromecast built-in, as a live HLS stream."
assets = [
    ["target/release/sccast", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sccast/", "644"],
]
