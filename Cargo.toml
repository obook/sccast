[package]
name = "sccast"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Olivier Booklage <olivier.booklage@ac-bordeaux.fr>"]
description = "Cast your Linux desktop to a Chromecast"
repository = "https://github.com/obook/sccast"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
gstreamer = "0.25.4"
mdns-sd = "0.21.5"
rust_cast = "0.21.0"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "net", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
